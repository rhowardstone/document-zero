# The roster, as machine-readable state.
#
# Standards.md is the editorial constitution: the rules, the sources, how to write. THIS
# file is the state those rules operate on. They were one file, and that was a
# blocker: the roster described beats in prose under "Standing beats" and never
# named a desk, while desk.md said "your desk's beats are listed under your
# name" and treated finding none as a normal outcome. Every desk would have
# halted silently, every day, and because empty runs are silent nothing would
# have alerted. The site would have gone stale under yesterday's honest date.
#
# Prose cannot be checked. This file is linted in CI by scripts/lint_beats.py,
# and the lint failing blocks the merge.
#
# Only the scout may change this file, and only by pull request.

desks: [justice, foreign, politics, disaster]

# Per-desk feeds, so a researcher reads what is relevant to its beat instead of
# wading through every feed in the building. Publisher-direct: an aggregator
# wrapper hides the real publisher, which has misclassified a source three times.
sources:
  all:
    - https://feeds.bbci.co.uk/news/world/rss.xml
    - https://feeds.bbci.co.uk/news/world/us_and_canada/rss.xml
    - https://www.independent.co.uk/news/world/rss
    - https://www.latimes.com/world-nation/rss2.0.xml
    - https://feeds.npr.org/1001/rss.xml
    - https://www.pbs.org/newshour/feeds/rss/headlines
  justice:
    - https://www.courthousenews.com/feed/
    - https://www.propublica.org/feeds/propublica/main
    - https://rss.politico.com/politics-news.xml
    # Discovery only. Open and cite the underlying publisher, never the wrapper.
    - https://epstein-data.com/api/corpus/news?limit=200
  foreign:
    - https://www.aljazeera.com/xml/rss/all.xml
    - https://feeds.npr.org/1004/rss.xml
    - https://www.theguardian.com/us-news/rss
  politics:
    - https://rss.politico.com/whitehouse.xml
    - https://thehill.com/news/feed/
    - https://feeds.npr.org/1014/rss.xml
    - https://feeds.npr.org/1017/rss.xml
    - https://feeds.nbcnews.com/nbcnews/public/news
    - https://www.cbsnews.com/latest/rss/main
  disaster:
    # Primary agency feeds beat any newspaper for beats whose fields are literally
    # river stage, storm status and warnings in effect. The disaster desk had no
    # sources at all, which is why its researchers were reading wire copy about
    # water levels instead of the gauge.
    - https://www.nhc.noaa.gov/index-at.xml            # National Hurricane Center
    - https://www.nhc.noaa.gov/index-ep.xml            # NHC, eastern Pacific
    - https://alerts.weather.gov/cap/us.php?x=0        # NWS active alerts
    - https://waterservices.usgs.gov/nwis/iv/          # USGS river gauges (query per site)
    - https://www.fema.gov/api/open/v2/DisasterDeclarationsSummaries

# `tier`     standing = check every run. watch = may have gone quiet; cover it
#            if it moved, and let the scout retire it when it stops.
# `fields`   what the beat tracks. Must be about the WORLD, never about our
#            records: "Death toll" is a field, "Most recent claim" is not.
#            At least two, or the beat fails the beat test.
# `clock`    a field that increments by definition — days elapsed, time until.
#            NEVER counts as movement: a beat resting on one is due in every
#            issue forever, which destroys the delta's adaptive cadence. Keep it
#            if a reader wants it; never let the clock turning over be an event.
# `deadlines` dated obligations. A date passing with nothing filed is news, and
#            it fires a delta issue on its own. `authority` names where absence
#            must be checked, which is what makes the claim verifiable at all.
# `opened`   ISO date. Used to compute the thirty-day retirement clock.

beats:
  - slug: nm-records
    name: New Mexico v. the Justice Department
    desk: justice
    tier: standing
    opened: 2026-08-14
    fields:
      - Federal suit
      - State criminal probe
      - Records sought
      - 2019 stand-down rationale
      - Administrative exhaustion
      - Stated grounds for refusal
    deadlines:
      - date: 2026-09-05
        what: Government response due, New Mexico v. DOJ (1:26-cv-02762-AHA)
        why: >-
          Where the protective-order and Privacy Act grounds must be defended on
          the record. Non-response is itself recordable.
        authority: D.D.C. docket, No. 1:26-cv-02762-AHA
      - date: 2026-09-15
        what: New Mexico truth commission subpoena returns
        why: Began 1 June 2026 with subpoena power over the Zorro Ranch period.
        authority: New Mexico truth commission public filings
      # The Texas Comptroller election was listed here and would have fired a
      # New Mexico records Delta for a Texas election. If it is a beat, it is its
      # own; it is not a deadline on this one.

