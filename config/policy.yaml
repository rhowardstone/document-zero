# Public editorial policy. This file is the editorial conscience: diffable,
# and every edition records which revision of it produced the edition.

publication:
  dry_run: true            # week one: write editions, deploy nothing
  kill_switch: false       # halts publication, never halts ingestion
  max_records_per_edition: 8

suppression:
  drop_if_already_in_circulation: true

lifecycle:
  open_min_events: 3
  open_min_span_days: 5
  open_min_state_fields: 2
  close_quiet_days: 30

recirculation:
  min_followers: 3
  min_gap_days: 1
  date_conflict_gap_days: 60

# Beats are independent by construction (see the write-partition rule), so the
# sweep produces byte-identical output at any concurrency. Width is a wall-clock
# choice, never a correctness one. Set to 1 if agent concurrency is constrained;
# the sweep runs at 04:30 and nobody is waiting.
sweep:
  concurrency: 4           # beats processed at once; 1 = fully sequential
  only_beats_with_new_sources: true
  max_sources_per_beat_per_run: 60   # oldest-first; overflow carries to next run
  budget_tokens_per_run: null        # null = unmetered; set once measured

verification:
  rounds_max: 3
  passes: [refute, lens]
  consensus_required: 2      # of 3 independent passes must fail to refute
  require_distinct_model_families: true
  on_single_family: cap_one_band_lower

# Categories that are REFUSED, never queued. There is no human reviewer, so the
# protection is not generating the exposure. See spec §6.3.
refuse:
  - wrongdoing_by_private_individual
  - identification_of_private_individual
  - uncorroborated_criminal_conduct

# The roster is the ONLY way a person gets public status without the text itself
# identifying them by office or naming them as a party to a case. It is curated
# on purpose: inferring "this name is famous enough to accuse" is exactly the
# judgement an automated system should not be making.
#
# Everyone not listed here, and not identified by title or case caption in the
# claim itself, is treated as a private individual — so a wrongdoing claim about
# them is refused rather than published. Over-refusal is the intended failure.
roster:
  # Named parties in the litigation these beats track.
  Jeffrey Epstein: named_party
  Ghislaine Maxwell: named_party
  Prince Andrew: public_figure
  Alexander Acosta: public_official
  Bill Richardson: public_official
  Raul Torrez: public_official
  Pam Bondi: public_official
  Todd Blanche: public_official
  Kash Patel: public_official
  Luigi Mangione: named_party
  Sean Combs: named_party
  Donald Trump: public_official
  Larry Nassar: named_party
  Bill Gates: public_figure
  Leon Black: public_figure
  Jes Staley: public_figure
  Glenn Dubin: public_figure
  Les Wexner: public_figure
  Alan Dershowitz: public_figure
  Hugh Hefner: public_figure
  Paolo Zampolli: public_figure
  # Officials whose conduct in office is the subject of the tracked litigation.
  Bill Clinton: public_official
  Melania Trump: public_figure
  Ken Paxton: public_official
  Nancy Mace: public_official
  James Comer: public_official
  Robert Garcia: public_official
  Thomas Massie: public_official
  Ro Khanna: public_official
  Marjorie Taylor Greene: public_official
  Emmet Sullivan: public_official
  Loretta Preska: public_official
  Richard Berman: public_official
  Michelle Lujan Grisham: public_official
#
# DELIBERATELY ABSENT: accusers, complainants and victims. Leaving a person off
# this list makes the gates MORE protective of them, not less — any wrongdoing
# claim naming them is refused. Several are named plaintiffs and would be
# defensible as `named_party`; that is precisely the entry that would strip the
# protection, so it is not made.

# Lower-risk uncertainty publishes AS A HOLD, with its reason. See spec §6.4.
hold:
  - date_conflict
  - single_root_multi_source
  - consensus_failure
  - schema_failure

disclosure:
  human_reviewed: false
  statement: >-
    Every record on this site is produced by AI agents and is not reviewed by a
    person before publication. Each record lists its sources, the confidence
    ceiling of each source type, which model families ran extraction and
    verification, and how many verification rounds it survived.
